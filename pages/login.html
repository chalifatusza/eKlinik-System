<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — E-Klinik UNESA</title>
    <link rel="icon" type="image/png" href="../assets/images/logo e-klinik.png">
    <meta name="description" content="Masuk ke sistem E-Klinik UNESA untuk mengakses layanan kesehatan kampus.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo-wrapper">
                <img src="../assets/images/logo e-klinik.png" alt="E-Klinik UNESA" class="logo-img" style="width:48px;height:48px;">
                <div class="logo-text">
                    <span class="logo-unesa">UNESA</span>
                    <span class="logo-eklinik">E-Klinik</span>
                </div>
            </div>
            <h2>Selamat Datang</h2>
            <p>Masuk ke sistem E-Klinik untuk mengakses layanan kesehatan</p>

            <div class="login-error" id="loginError"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="nimInput">NIM / Username</label>
                    <input type="text" id="nimInput" class="form-input" placeholder="Masukkan NIM atau username" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" class="form-input" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="login-btn" id="loginSubmitBtn">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>

            <div style="display:flex;align-items:center;gap:12px;margin:var(--spacing-lg) 0;">
                <div style="flex:1;height:1px;background:var(--gray-300);"></div>
                <span style="color:var(--text-muted);font-size:var(--font-size-sm);">atau</span>
                <div style="flex:1;height:1px;background:var(--gray-300);"></div>
            </div>

            <button type="button" class="sso-login-btn" id="ssoBtn">
                <img src="../assets/images/sso.png" alt="SSO UNESA">
                <div class="sso-btn-text">
                    <span class="sso-btn-label">Single Sign On</span>
                    <span class="sso-btn-title">Login dengan SSO UNESA</span>
                </div>
            </button>

            <div class="login-demo">
                <p><strong>Demo Akun:</strong></p>
                <p>Admin: <code>admin</code> / <code>admin123</code></p>
                <p>Dokter: <code>dokter1</code> / <code>dokter123</code></p>
                <p>Mahasiswa: <code>2024001</code> / <code>mhs123</code></p>
            </div>

            <div style="text-align:center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
                Belum punya akun? <a href="register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Daftar Sekarang</a>
            </div>

            <div style="text-align:center; margin-top: 8px; font-size: 13px;">
                <a href="#" style="color: var(--text-muted); text-decoration: none;">Lupa Password?</a>
            </div>

            <div style="margin-top:var(--spacing-lg);">
                <a href="../index.html" style="color:var(--primary-color);text-decoration:none;font-size:var(--font-size-sm);">
                    <i class="fas fa-arrow-left"></i> Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { login, redirectIfLoggedIn } from '../js/auth.js';
        import { openSSOModal } from '../js/sso.js';

        const urlParams = new URLSearchParams(window.location.search);
        const redirectPage = urlParams.get('redirect');

        // Redirect if already logged in
        if (!redirectPage) redirectIfLoggedIn();

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('loginSubmitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

            const nim = document.getElementById('nimInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            try {
                const user = await login(nim, password);
                if (user) {
                    if (redirectPage) {
                        window.location.href = redirectPage + '.html';
                    } else if (user.role === 'mahasiswa') {
                        window.location.href = 'student-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    errorEl.textContent = 'NIM/Username atau password salah. Silakan coba lagi.';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorEl.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
                errorEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
            }
        });

        // SSO UNESA button handler — opens SSO modal
        document.getElementById('ssoBtn')?.addEventListener('click', () => {
            openSSOModal(null, redirectPage);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsultasi Online - E-Klinik UNESA</title>
<link rel="icon" type="image/png" href="../assets/images/logo e-klinik.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 80px);max-height:700px;background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);}
.chat-header{background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;}
.chat-header .avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:#f0f4f8;}
.msg{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;position:relative;}
.msg.sent{align-self:flex-end;background:var(--primary-color);color:#fff;border-bottom-right-radius:4px;}
.msg.received{align-self:flex-start;background:#fff;color:var(--text-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);border-bottom-left-radius:4px;}
.msg .msg-time{font-size:11px;opacity:.7;margin-top:4px;display:block;}
.chat-input{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--gray-200);background:#fff;}
.chat-input input{flex:1;border:1px solid var(--gray-300);border-radius:24px;padding:10px 18px;font-size:14px;outline:none;transition:border .2s;}
.chat-input input:focus{border-color:var(--primary-color);}
.chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:var(--primary-color);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.chat-input button:hover{background:var(--primary-dark);transform:scale(1.05);}
.doctor-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.doctor-pick-card{background:#fff;border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;border:2px solid var(--gray-200);transition:all .2s;}
.doctor-pick-card:hover{border-color:var(--primary-color);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.doctor-pick-card .initials{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 12px;}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:6px;}
</style>
</head>
<body>
<div class="admin-layout">
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
<div class="content-header">
<div style="display:flex;align-items:center;gap:var(--spacing-md);">
<button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
<h1>Konsultasi Online</h1>
</div>
<div id="userInfoContainer"></div>
</div>
<div class="content-body">
<!-- Step 1: Pick Doctor -->
<div id="pickDoctor">
<div style="text-align:center;margin-bottom:24px;">
<h3>Pilih Dokter untuk Konsultasi</h3>
<p style="color:var(--text-muted);">Pilih dokter yang tersedia untuk memulai sesi konsultasi online</p>
</div>
<div class="doctor-pick" id="doctorPickGrid">
<div class="text-center" style="grid-column:1/-1;"><div class="spinner"></div></div>
</div>
</div>
<!-- Step 2: Chat -->
<div id="chatView" style="display:none;">
<div class="chat-container">
<div class="chat-header">
<a href="#" id="backToList" style="color:#fff;font-size:18px;"><i class="fas fa-arrow-left"></i></a>
<div class="avatar" id="chatDoctorInitials">D</div>
<div>
<div style="font-weight:600;" id="chatDoctorName">Dokter</div>
<div style="font-size:12px;opacity:.8;"><span class="online-dot"></span>Online</div>
</div>
</div>
<div class="chat-messages" id="chatMessages">
<div class="msg received">
<span>Selamat datang di konsultasi online E-Klinik UNESA. Silakan sampaikan keluhan Anda.</span>
<span class="msg-time">Sistem</span>
</div>
</div>
<div class="chat-input">
<input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off">
<button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>
</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { requireAuth, getCurrentUser, logout, renderUserInfo } from '../js/auth.js';
import { getAllDoctors, createConsultation, sendChatMessage, onChatMessages } from '../js/db.js';
import { renderSidebar } from '../js/sidebar.js';

if (!requireAuth(['mahasiswa','admin','dokter'])) {}
renderSidebar();
const user = getCurrentUser();
renderUserInfo('#userInfoContainer');

let currentConsultId = null;
let unsubChat = null;

// Load doctors
async function loadDoctors() {
  try {
    const doctors = await getAllDoctors();
    const grid = document.getElementById('doctorPickGrid');
    if (!doctors.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;"><p>Belum ada dokter tersedia.</p></div>';
      return;
    }
    grid.innerHTML = doctors.map(d => `
      <div class="doctor-pick-card" data-id="${d.id}" data-name="${d.name}" data-initials="${d.initials || d.name.charAt(0)}">
        <div class="initials">${d.initials || d.name.charAt(0)}</div>
        <h4 style="margin:0 0 4px;">${d.name}</h4>
        <span style="color:var(--text-muted);font-size:13px;">${d.specialty}</span><br>
        <span style="font-size:12px;color:var(--success);margin-top:8px;display:inline-block;"><span class="online-dot"></span>Tersedia</span>
      </div>
    `).join('');

    grid.querySelectorAll('.doctor-pick-card').forEach(card => {
      card.addEventListener('click', () => startConsultation(card.dataset.id, card.dataset.name, card.dataset.initials));
    });
  } catch (e) {
    console.error(e);
    document.getElementById('doctorPickGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;"><p>Gagal memuat dokter.</p><button onclick="location.reload()" class="btn btn-outline">Coba Lagi</button></div>';
  }
}

async function startConsultation(doctorId, doctorName, initials) {
  document.getElementById('chatDoctorName').textContent = doctorName;
  document.getElementById('chatDoctorInitials').textContent = initials;
  document.getElementById('pickDoctor').style.display = 'none';
  document.getElementById('chatView').style.display = 'block';

  try {
    currentConsultId = await createConsultation({
      doctorId, doctorName,
      patientNim: user?.nim || '', patientName: user?.name || ''
    });

    if (currentConsultId) {
      // Send welcome message
      await sendChatMessage(currentConsultId, {
        sender: 'system', senderName: 'Sistem',
        text: `Sesi konsultasi dimulai dengan ${doctorName}. Silakan sampaikan keluhan Anda.`
      });

      // Listen for messages
      unsubChat = onChatMessages(currentConsultId, (messages) => {
        renderMessages(messages);
      });
    }
  } catch (e) {
    console.error('Error starting consultation:', e);
    // Still allow typing even if Firestore fails
  }
}

function renderMessages(messages) {
  const container = document.getElementById('chatMessages');
  container.innerHTML = messages.map(m => {
    const isMine = m.sender === 'patient' || m.senderName === user?.name;
    const time = m.timestamp ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="msg ${isMine ? 'sent' : 'received'}"><span>${m.text}</span><span class="msg-time">${m.senderName || ''} ${time}</span></div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

// Send message
async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentConsultId) return;
  input.value = '';

  await sendChatMessage(currentConsultId, {
    sender: 'patient', senderName: user?.name || 'Mahasiswa', text
  });

  // Auto-reply simulation (since no real doctor is online)
  setTimeout(async () => {
    const replies = [
      'Terima kasih atas informasinya. Apakah Anda memiliki keluhan lain?',
      'Saya mengerti. Sudah berapa lama Anda mengalami gejala ini?',
      'Baik, saya sarankan Anda untuk datang ke klinik untuk pemeriksaan lebih lanjut.',
      'Apakah Anda sedang mengonsumsi obat tertentu saat ini?',
      'Kondisi ini cukup umum. Saya akan memberikan rekomendasi pengobatan.',
      'Pastikan Anda istirahat cukup dan minum air yang banyak.',
    ];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    await sendChatMessage(currentConsultId, {
      sender: 'doctor', senderName: document.getElementById('chatDoctorName').textContent, text: reply
    });
  }, 1500);
}

document.getElementById('sendBtn').addEventListener('click', sendMsg);
document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });

document.getElementById('backToList').addEventListener('click', (e) => {
  e.preventDefault();
  if (unsubChat) unsubChat();
  currentConsultId = null;
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('pickDoctor').style.display = 'block';
});

loadDoctors();
</script>
</body>
</html>

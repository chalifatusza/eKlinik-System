<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun — E-Klinik UNESA</title>
    <link rel="icon" type="image/png" href="../assets/images/logo e-klinik.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        .register-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
        }
        .register-header h2 { font-weight: 800; margin-bottom: 8px; }
        .register-body { padding: 40px; }
        .form-floating { margin-bottom: 20px; }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: var(--transition-base);
            margin-top: 10px;
        }
        .btn-register:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h2>Daftar Akun</h2>
            <p>Bergabung dengan layanan kesehatan digital UNESA</p>
        </div>
        <div class="register-body">
            <form id="registerForm">
                <div class="form-floating">
                    <input type="text" class="form-control" id="regNim" placeholder="NIM" required>
                    <label for="regNim">NIM / NIP</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="regName" placeholder="Nama Lengkap" required>
                    <label for="regName">Nama Lengkap</label>
                </div>
                <div class="form-floating">
                    <input type="email" class="form-control" id="regEmail" placeholder="Email" required>
                    <label for="regEmail">Email</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="regPass" placeholder="Password" required>
                    <label for="regPass">Password</label>
                </div>
                <div class="form-floating">
                    <select class="form-select" id="regRole" aria-label="Role Selection">
                        <option value="mahasiswa" selected>Mahasiswa</option>
                        <option value="dokter">Dokter</option>
                        <option value="admin">Admin</option>
                    </select>
                    <label for="regRole">Mendaftar Sebagai</label>
                </div>
                <button type="submit" class="btn-register" id="btnRegister">Daftar Sekarang</button>
            </form>
            <div class="login-link">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script type="module">
        import { createUser } from '../js/db.js';
        
        const form = document.getElementById('registerForm');
        const btn = document.getElementById('btnRegister');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses...';

            const data = {
                nim: document.getElementById('regNim').value,
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value,
                role: document.getElementById('regRole').value,
                createdAt: new Date().toISOString()
            };

            try {
                const userId = await createUser(data);
                if (userId) {
                    showToast('Pendaftaran berhasil! Silakan masuk.', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showToast('Gagal mendaftar. NIM mungkin sudah terdaftar.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Terjadi kesalahan sistem.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Daftar Sekarang';
            }
        });

        function showToast(msg, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0`;
            toast.role = 'alert';
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
